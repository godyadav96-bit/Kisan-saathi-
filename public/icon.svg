<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
  </defs>
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  
  <!-- Glowing Sun -->
  <circle cx="360" cy="150" r="60" fill="url(#sunGrad)" opacity="0.9" />
  
  <!-- Sun Rays -->
  <line x1="360" y1="65" x2="360" y2="45" stroke="#fde047" stroke-width="8" stroke-linecap="round" />
  <line x1="420" y1="90" x2="435" y2="75" stroke="#fde047" stroke-width="8" stroke-linecap="round" />
  <line x1="445" y1="150" x2="465" y2="150" stroke="#fde047" stroke-width="8" stroke-linecap="round" />
  <line x1="420" y1="210" x2="435" y2="225" stroke="#fde047" stroke-width="8" stroke-linecap="round" />
  
  <!-- Soil / Earth Ground Curved Base -->
  <path d="M60 410 Q 256 360 452 410 L452 452 L60 452 Z" fill="#854d0e" opacity="0.4" />
  <path d="M40 430 Q 256 385 472 430 L472 472 L40 472 Z" fill="#713f12" opacity="0.6" />

  <!-- Central Wheat & Plant Stem -->
  <path d="M256 420 Q 256 260 256 160" stroke="#facc15" stroke-width="12" stroke-linecap="round" />
  
  <!-- Plant Sprout Leaves -->
  <!-- Left Leaf -->
  <path d="M256 320 C 180 300 130 220 160 170 C 200 190 240 250 256 300 Z" fill="url(#leafGrad)" />
  <!-- Right Leaf -->
  <path d="M256 260 C 330 230 370 170 340 120 C 300 150 270 210 256 240 Z" fill="#86efac" />
  
  <!-- Wheat Grains / Ear at the Top -->
  <ellipse cx="256" cy="140" rx="18" ry="28" fill="#facc15" />
  <ellipse cx="230" cy="170" rx="14" ry="24" fill="#fde047" transform="rotate(-25 230 170)" />
  <ellipse cx="282" cy="170" rx="14" ry="24" fill="#fde047" transform="rotate(25 282 170)" />
  <ellipse cx="225" cy="210" rx="14" ry="24" fill="#facc15" transform="rotate(-30 225 210)" />
  <ellipse cx="287" cy="210" rx="14" ry="24" fill="#facc15" transform="rotate(30 287 210)" />

  <!-- Sparkle / Tech Accent (AI Saathi) -->
  <path d="M120 120 L 126 138 L 144 144 L 126 150 L 120 168 L 114 150 L 96 144 L 114 138 Z" fill="#fde047" />
  <path d="M390 280 L 394 292 L 406 296 L 394 300 L 390 312 L 386 300 L 374 296 L 386 292 Z" fill="#fde047" opacity="0.8" />
</svg>
